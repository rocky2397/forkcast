name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        # The suite must never reach the network: tests needing the Epicure
        # weights are marked and skip themselves. Offline mode turns an
        # unmarked one into a loud failure instead of a 100 MB download.
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Also type-checks: the build script is `tsc -b && vite build`.
      - run: npm run build

# Not built here: the Docker image (D15). It prefetches the Epicure weights and
# bakes in the ~130 MB corpus, which costs more CI time than it protects —
# nothing in the app's code can break it that these two jobs don't catch first.
